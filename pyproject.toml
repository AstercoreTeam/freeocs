[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "freeocs"
version = "0.1.0"
description = "FreeOCS - local-first, plugin-based study assistant desktop app"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "AGPL-3.0-only" }
authors = [
  { name = "qincnd", email = "qincnd@qq.com" },
  { name = "XueZicheng", email = "xuezicheng842@outlook.com" },
]
dependencies = [
  "pywebview[gtk]>=5,<6; sys_platform == 'linux'",
  "pywebview>=5,<6; sys_platform != 'linux'",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
asr = ["faster-whisper>=1.2,<2", "av>=15,<16"]
ocr = ["rapidocr-onnxruntime>=1.4", "pillow>=10"]
tts = ["pyttsx3>=2.90,<3", "edge-tts>=6.1"]
dev = ["pytest>=8", "pytest-timeout>=2", "ruff>=0.6", "pyinstaller>=6.6", "playwright>=1.48"]
all = ["freeocs[asr,ocr,tts]"]
packaging = ["pyinstaller>=6.6"]

[tool.setuptools.packages.find]
include = ["freeocs*"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["web/vendor", "packages/dist", "extension/dist", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 60
addopts = "-q"
