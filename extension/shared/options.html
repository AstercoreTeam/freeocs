<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>FreeOCS Bridge 设置</title>
  <style>
    body { font: 14px/1.6 -apple-system, "Segoe UI", "Noto Sans CJK SC", sans-serif; margin: 0; padding: 24px; background: #f5f7fb; color: #1f2937; }
    .card { max-width: 520px; margin: 0 auto; background: #fff; border: 1px solid #e3e8f0; border-radius: 12px; padding: 22px; box-shadow: 0 6px 24px rgba(20,35,70,.07); }
    h1 { font-size: 18px; margin: 0 0 4px; }
    p.hint { color: #6b7280; font-size: 13px; margin: 0 0 18px; }
    label { display: block; font-weight: 600; margin: 14px 0 6px; }
    input[type="number"] { width: 100%; box-sizing: border-box; padding: 8px 10px; border: 1px solid #cfd8e6; border-radius: 8px; }
    .row { display: flex; align-items: center; gap: 10px; margin-top: 14px; }
    .btn { padding: 8px 14px; border-radius: 8px; border: 1px solid #cfd8e6; background: #fff; cursor: pointer; }
    .btn.primary { background: #2f6fed; border-color: #2f6fed; color: #fff; }
    .status { margin-top: 16px; padding: 10px 12px; border-radius: 8px; background: #f8fafc; border: 1px solid #e3e8f0; font-size: 13px; white-space: pre-wrap; }
    .ok { color: #16a34a; }
    .bad { color: #dc2626; }
    .foot { margin-top: 18px; color: #6b7280; font-size: 12px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>FreeOCS Bridge</h1>
    <p class="hint">连接本机 FreeOCS（仅 127.0.0.1）。修改端口后请与 FreeOCS 设置 → 浏览器自动化保持一致。</p>

    <label for="port">本地端口</label>
    <input id="port" type="number" min="1024" max="65535" value="8765">

    <div class="row">
      <label style="margin:0;display:flex;align-items:center;gap:8px;font-weight:400;">
        <input id="enabled" type="checkbox" checked> 启用中继
      </label>
    </div>

    <div class="row">
      <button class="btn primary" id="save">保存</button>
      <button class="btn" id="test">测试连接</button>
    </div>

    <div class="status" id="status">读取配置…</div>
    <div class="foot">版本 <span id="version">-</span> · 扩展只负责传输，不保存 API Key/题目/答案。</div>
  </div>
  <script src="options.js"></script>
</body>
</html>
